<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
      user-select: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      flex: 1;
    }

    /* Logo */
    .logo-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrapper img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      z-index: 2;
      opacity: 0;
      transform: scale(0.8);
      animation: logoIn 0.8s ease-out 0.3s forwards;
      filter: drop-shadow(0 0 30px rgba(59, 130, 246, 0.3));
    }

    /* Rotating ring behind logo */
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(59, 130, 246, 0.15);
      animation: rotate 8s linear infinite;
    }

    .ring::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #3b82f6;
      box-shadow: 0 0 12px #3b82f6, 0 0 24px #3b82f680;
    }

    .ring-2 {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(139, 92, 246, 0.1);
      animation: rotate 12s linear infinite reverse;
    }

    .ring-2::before {
      content: '';
      position: absolute;
      bottom: -2px;
      right: 50%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #8b5cf6;
      box-shadow: 0 0 10px #8b5cf6;
    }

    /* Pulsing glow behind logo */
    .glow {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15), transparent 70%);
      animation: glowPulse 3s ease-in-out infinite;
    }

    /* Text */
    .text-block {
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.6s ease-out 0.8s forwards;
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 11px;
      color: #475569;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* Center loading */
    .loading-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeUp 0.6s ease-out 1.2s forwards;
    }

    .loading-text {
      font-size: 10px;
      color: #334155;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* Footer bar */
    .footer-bar {
      -webkit-app-region: no-drag;
      width: 100%;
      padding: 0 0 0 0;
      position: relative;
      overflow: hidden;
    }

    .footer-track {
      width: 100%;
      height: 3px;
      background: rgba(15, 23, 42, 0.8);
      position: relative;
    }

    .footer-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #34d399, #3b82f6);
      background-size: 300% 100%;
      animation: loadFill 13s ease-in-out 1.4s forwards, gradientShift 3s linear infinite;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5), 0 0 30px rgba(59, 130, 246, 0.2);
      position: relative;
    }

    .footer-fill::after {
      content: '';
      position: absolute;
      right: 0;
      top: -2px;
      width: 6px;
      height: 7px;
      border-radius: 50%;
      background: #60a5fa;
      box-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f680;
    }

    .footer-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px;
      background: rgba(10, 15, 26, 0.6);
    }

    .footer-left {
      font-size: 9px;
      color: #334155;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .footer-center {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .footer-percent {
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #60a5fa;
      min-width: 36px;
      text-align: center;
    }

    .footer-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #3b82f6;
      opacity: 0.4;
      animation: dotPulse 1.5s ease-in-out infinite;
    }

    .footer-dot:nth-child(2) { animation-delay: 0.3s; }
    .footer-dot:nth-child(3) { animation-delay: 0.6s; }

    .footer-right {
      font-size: 9px;
      color: #334155;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #3b82f6;
      border-radius: 50%;
      opacity: 0;
      animation: particleFloat 6s ease-in-out infinite;
    }

    @keyframes logoIn {
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }

    @keyframes loadFill {
      0%   { width: 0%; }
      5%   { width: 5%; }
      15%  { width: 15%; }
      30%  { width: 32%; }
      50%  { width: 55%; }
      70%  { width: 75%; }
      85%  { width: 88%; }
      95%  { width: 96%; }
      100% { width: 100%; }
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    @keyframes particleFloat {
      0% { opacity: 0; transform: translateY(100vh) scale(0); }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(-20px) scale(1); }
    }
  </style>
</head>
<body>
  <div class="particles">
    <div class="particle" style="left:10%; animation-delay:0s; animation-duration:5s;"></div>
    <div class="particle" style="left:20%; animation-delay:0.8s; animation-duration:6s;"></div>
    <div class="particle" style="left:35%; animation-delay:1.5s; animation-duration:5.5s;"></div>
    <div class="particle" style="left:50%; animation-delay:0.3s; animation-duration:7s;"></div>
    <div class="particle" style="left:65%; animation-delay:2s; animation-duration:5s;"></div>
    <div class="particle" style="left:75%; animation-delay:1s; animation-duration:6.5s;"></div>
    <div class="particle" style="left:88%; animation-delay:0.5s; animation-duration:5.8s;"></div>
    <div class="particle" style="left:95%; animation-delay:1.8s; animation-duration:6.2s;"></div>
  </div>

  <div class="container">
    <div class="logo-wrapper">
      <div class="glow"></div>
      <div class="ring"></div>
      <div class="ring-2"></div>
      <img src="logo12.png" alt="Logo" />
    </div>

    <div class="text-block">
      <div class="title">ARGM</div>
      <div class="subtitle">Advanced Radiation Gamma Monitor</div>
    </div>

    <div class="loading-section">
      <div class="loading-text" id="statusText">Initializing systems</div>
    </div>
  </div>

  <!-- Footer loading bar -->
  <div class="footer-bar">
    <div class="footer-track">
      <div class="footer-fill" id="footerFill"></div>
    </div>
    <div class="footer-info">
      <span class="footer-left">Booting</span>
      <div class="footer-center">
        <div class="footer-dot"></div>
        <div class="footer-dot"></div>
        <div class="footer-dot"></div>
        <span class="footer-percent" id="percentText">0%</span>
      </div>
      <span class="footer-right">ARGM v1.0.0</span>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('statusText');
    const percentEl = document.getElementById('percentText');

    const stages = [
      { at: 0,   text: 'Initializing core systems' },
      { at: 5,   text: 'Loading database engine' },
      { at: 15,  text: 'Starting tile server' },
      { at: 30,  text: 'Calibrating serial manager' },
      { at: 50,  text: 'Loading offline map tiles' },
      { at: 70,  text: 'Preparing IPC handlers' },
      { at: 85,  text: 'Finalizing configuration' },
      { at: 95,  text: 'Launching application' },
    ];

    // Animate percentage counter from 0 to 100 over 13s (starts at 1.4s delay)
    const totalDuration = 13000;
    const startTime = performance.now() + 1400;

    function updatePercent() {
      const elapsed = performance.now() - startTime;
      if (elapsed < 0) {
        requestAnimationFrame(updatePercent);
        return;
      }
      const progress = Math.min((elapsed / totalDuration) * 100, 100);
      const rounded = Math.floor(progress);
      percentEl.textContent = rounded + '%';

      // Update status text
      for (let i = stages.length - 1; i >= 0; i--) {
        if (rounded >= stages[i].at) {
          if (statusEl.textContent !== stages[i].text) {
            statusEl.textContent = stages[i].text;
          }
          break;
        }
      }

      if (progress < 100) {
        requestAnimationFrame(updatePercent);
      } else {
        percentEl.textContent = '100%';
        statusEl.textContent = 'Ready';
      }
    }

    requestAnimationFrame(updatePercent);
  </script>
</body>
</html>
